<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">额度管家 Quota Butler</title>
  <desc id="desc">在 Mac 本地读取 Claude Code 和 Codex 额度，通过飞书私聊查询、提醒并安排预热。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1020"/>
      <stop offset="1" stop-color="#121D36"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="400" rx="28" fill="url(#bg)"/>

  <g id="time-window-motif" opacity=".18" stroke="#8FA8CF" stroke-width="1">
    <path d="M52 332H1148"/>
    <path d="M78 322V342M158 326V338M238 322V342M318 326V338M398 322V342M478 326V338M558 322V342M638 326V338M718 322V342M798 326V338M878 322V342M958 326V338M1038 322V342M1118 326V338"/>
  </g>

  <g id="title-block" transform="translate(64 54)" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif">
    <text x="0" y="18" fill="#7FAAFF" font-size="18" font-weight="700" letter-spacing="2">MACOS · FEISHU / LARK · LOCAL FIRST</text>
    <text x="0" y="100" fill="#F8FAFC" font-size="68" font-weight="800">额度管家</text>
    <text x="0" y="148" fill="#BFD1EA" font-size="30" font-weight="600">Quota Butler</text>
    <text x="0" y="206" fill="#E6EDF8" font-size="25">把 Claude Code / Codex 的额度窗口，</text>
    <text x="0" y="242" fill="#E6EDF8" font-size="25">变成看得见、能提醒、可安排的工作时间。</text>

    <g transform="translate(0 272)" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="17">
      <rect width="142" height="38" rx="19" fill="#152544" stroke="#426DAE"/>
      <text x="71" y="25" text-anchor="middle" fill="#AFCBFF">本地读取额度</text>
      <rect x="154" width="128" height="38" rx="19" fill="#153A31" stroke="#2D8069"/>
      <text x="218" y="25" text-anchor="middle" fill="#8DE0BE">确定性调度</text>
      <rect x="294" width="132" height="38" rx="19" fill="#3D3020" stroke="#8B6730"/>
      <text x="360" y="25" text-anchor="middle" fill="#FFD98A">不接聊天模型</text>
    </g>
  </g>

  <g id="quota-proof" transform="translate(674 42)" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif">
    <rect width="466" height="320" rx="22" fill="#F8FAFC"/>
    <circle cx="30" cy="28" r="6" fill="#FF6B6B"/>
    <circle cx="50" cy="28" r="6" fill="#FFCC66"/>
    <circle cx="70" cy="28" r="6" fill="#45D483"/>
    <text x="233" y="34" text-anchor="middle" fill="#334155" font-size="18" font-weight="700">额度窗口 / QUOTA WINDOWS</text>

    <g transform="translate(28 62)">
      <text x="0" y="22" fill="#0F172A" font-size="20" font-weight="700">Claude Code</text>
      <text x="380" y="22" text-anchor="end" fill="#167A56" font-size="18" font-weight="700">5 小时 + 7 天</text>
      <rect y="38" width="380" height="14" rx="7" fill="#D8E1ED"/>
      <rect y="38" width="286" height="14" rx="7" fill="#4C8DFF"/>
      <circle cx="286" cy="45" r="8" fill="#FFFFFF" stroke="#4C8DFF" stroke-width="4"/>
      <text x="0" y="78" fill="#64748B" font-size="17">09:00</text>
      <text x="190" y="78" text-anchor="middle" fill="#64748B" font-size="17">14:00</text>
      <text x="380" y="78" text-anchor="end" fill="#64748B" font-size="17">19:00</text>
      <path d="M22 88V116M212 88V116" stroke="#45D483" stroke-width="4" stroke-linecap="round"/>
      <circle cx="22" cy="102" r="9" fill="#45D483"/>
      <circle cx="212" cy="102" r="9" fill="#45D483"/>
      <text x="22" y="139" text-anchor="middle" fill="#167A56" font-size="16" font-weight="700">预热</text>
      <text x="212" y="139" text-anchor="middle" fill="#167A56" font-size="16" font-weight="700">续上</text>
    </g>

    <path d="M28 224H438" stroke="#D8E1ED"/>
    <g transform="translate(28 238)">
      <text x="0" y="20" fill="#0F172A" font-size="20" font-weight="700">Codex</text>
      <text x="380" y="20" text-anchor="end" fill="#9A6811" font-size="18" font-weight="700">周额度周期</text>
      <rect y="34" width="380" height="14" rx="7" fill="#E7E1D3"/>
      <rect y="34" width="248" height="14" rx="7" fill="#FFCC66"/>
      <path d="M248 28V56" stroke="#9A6811" stroke-width="3"/>
      <text x="248" y="76" text-anchor="middle" fill="#80540B" font-size="16" font-weight="700">重置后首条消息激活</text>
    </g>
  </g>
</svg>
