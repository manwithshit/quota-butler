<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="570" viewBox="0 0 1200 570" role="img" aria-labelledby="title desc">
  <title id="title">How Quota Butler works</title>
  <desc id="desc">A private Feishu or Lark command reaches Quota Butler on the local Mac; it reads local Claude Code and Codex CLI status, returns a card, and executes adopted warm-up plans.</desc>

  <rect width="1200" height="570" rx="28" fill="#F5F8FC"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif">
    <text x="64" y="68" fill="#0F172A" font-size="40" font-weight="800">One command, four deterministic steps</text>
    <text x="64" y="104" fill="#64748B" font-size="20">Decisions and state stay on the Mac; Feishu/Lark provides the private chat and card receipts.</text>

    <g id="step-1" transform="translate(64 148)">
      <rect width="246" height="246" rx="22" fill="#FFFFFF" stroke="#C9D7EA" stroke-width="2"/>
      <circle cx="40" cy="40" r="22" fill="#4C8DFF"/>
      <text x="40" y="48" text-anchor="middle" fill="#FFFFFF" font-size="22" font-weight="800">1</text>
      <text x="28" y="96" fill="#0F172A" font-size="27" font-weight="800">Send a command</text>
      <text x="28" y="135" fill="#334155" font-size="20">quota / menu</text>
      <text x="28" y="168" fill="#334155" font-size="20">view current plan</text>
      <text x="28" y="201" fill="#334155" font-size="20">plan tomorrow</text>
      <text x="28" y="228" fill="#64748B" font-size="17">private Feishu/Lark chat</text>
    </g>

    <g id="step-2" transform="translate(340 148)">
      <rect width="246" height="246" rx="22" fill="#0E1930"/>
      <circle cx="40" cy="40" r="22" fill="#4C8DFF"/>
      <text x="40" y="48" text-anchor="middle" fill="#FFFFFF" font-size="22" font-weight="800">2</text>
      <text x="28" y="96" fill="#F8FAFC" font-size="27" font-weight="800">Read locally</text>
      <rect x="28" y="121" width="190" height="38" rx="10" fill="#182A4B"/>
      <text x="43" y="147" fill="#BFD1EA" font-size="18" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">Claude Code CLI</text>
      <rect x="28" y="169" width="190" height="38" rx="10" fill="#182A4B"/>
      <text x="43" y="195" fill="#BFD1EA" font-size="18" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">Codex CLI</text>
      <text x="28" y="228" fill="#8FA8CF" font-size="17">no LLM chat completion</text>
    </g>

    <g id="step-3" transform="translate(616 148)">
      <rect width="246" height="246" rx="22" fill="#FFFFFF" stroke="#C9D7EA" stroke-width="2"/>
      <circle cx="40" cy="40" r="22" fill="#45B98A"/>
      <text x="40" y="48" text-anchor="middle" fill="#FFFFFF" font-size="22" font-weight="800">3</text>
      <text x="28" y="96" fill="#0F172A" font-size="27" font-weight="800">Decide</text>
      <text x="28" y="135" fill="#334155" font-size="20">classify quota tier</text>
      <text x="28" y="168" fill="#334155" font-size="20">calculate recovery</text>
      <text x="28" y="201" fill="#334155" font-size="20">build warm-up nodes</text>
      <text x="28" y="228" fill="#64748B" font-size="17">same input, same plan</text>
    </g>

    <g id="step-4" transform="translate(892 148)">
      <rect width="244" height="246" rx="22" fill="#FFF9EC" stroke="#E8CE96" stroke-width="2"/>
      <circle cx="40" cy="40" r="22" fill="#D49A2B"/>
      <text x="40" y="48" text-anchor="middle" fill="#FFFFFF" font-size="22" font-weight="800">4</text>
      <text x="28" y="96" fill="#0F172A" font-size="27" font-weight="800">Reply &amp; run</text>
      <text x="28" y="135" fill="#334155" font-size="20">return quota cards</text>
      <text x="28" y="168" fill="#334155" font-size="20">notify recovery</text>
      <text x="28" y="201" fill="#334155" font-size="20">perform warm-ups</text>
      <text x="28" y="228" fill="#80540B" font-size="17">send an execution receipt</text>
    </g>

    <g id="connectors" stroke="#89A3C5" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M310 271H330"/>
      <path d="M324 263L332 271L324 279"/>
      <path d="M586 271H606"/>
      <path d="M600 263L608 271L600 279"/>
      <path d="M862 271H882"/>
      <path d="M876 263L884 271L876 279"/>
    </g>

    <g id="local-boundary" transform="translate(64 438)">
      <rect width="1072" height="72" rx="18" fill="#E7EEF8"/>
      <circle cx="36" cy="36" r="12" fill="#45B98A"/>
      <text x="62" y="33" fill="#1E293B" font-size="20" font-weight="700">Local boundary</text>
      <text x="62" y="56" fill="#52657D" font-size="17">App credentials, tokens, user IDs, plan state, and CLI authentication stay outside the repository.</text>
    </g>
  </g>
</svg>
